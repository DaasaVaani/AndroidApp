name: Repository hygiene

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  hygiene:
    name: Bootstrap files and YAML syntax
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source and pinned contracts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.15.0
          cache: npm
      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Generate owned configuration
        run: |
          npm ci
          npm run config
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          log-accepted-android-sdk-licenses: 'false'
      - name: Install configured Android platform
        run: |
          compile_sdk=$(sed -n 's/^compileSdk=//p' build/generated/config.properties)
          test -n "$compile_sdk"
          sdkmanager "platforms;${compile_sdk}"
      - name: Build all variants and run JVM and lint suites
        run: ./gradlew :core:build :app:build :app:lintDebug :app:lintRelease --no-daemon
      - name: Check repository files
        run: python3 tools/check_repository.py
      - name: Parse YAML configuration and issue forms
        run: |
          ruby -e 'require "yaml"; Dir.glob(".github/**/*.{yml,yaml}").each { |path| YAML.load_file(path); puts "Parsed #{path}" }'
      - name: Check committed whitespace including the initial commit
        run: git show --format= --check HEAD
